// ---------------- AI Assist (local, rule-based -- no external API/key) ----------------
// A lightweight keyword-matching "assistant" that answers questions about the
// app's OWN live data (production today, stock, OS/shortages, deliveries,
// etc.) by reading straight from `state`/`computeAggregates()`. No network
// call, no API key, no cost -- but it only understands the question patterns
// below, not free-form conversation.
const AI_SUGGESTIONS = [
  'Berapa hasil produksi hari ini?',
  'Berapa PO masuk hari ini?',
  'Berapa pallet keluar hari ini?',
  'Berapa total stok palet?',
  'OS produksi apa yang paling mendesak?',
  'Berapa PO yang belum diproduksi?',
  'Berapa subcont bulan ini?',
  'Customer apa yang sudah kelebihan produksi?',
];

// Finds a known customer name mentioned inside the question text, matching
// on whole tokens (not raw substrings) after stripping common "noise" words
// -- generic app vocabulary ("stok", "palet", "produksi", "total", ...) and
// company-type prefixes ("pt", "cv", "ud") are excluded from matching on
// BOTH sides, so a question like "berapa total stok palet" never
// accidentally matches a customer literally named "... PALET" just because
// the word "palet" happens to appear in both. Numbers are allowed even when
// short (e.g. "113") since they're often part of a customer's own name.
const AI_STOPWORDS = [
  'pt', 'cv', 'ud', 'palet', 'pallet', 'stok', 'stock', 'produksi', 'diproduksi', 'hasil',
  'kirim', 'dikirim', 'keluar', 'masuk', 'kekurangan', 'kelebihan', 'lebih', 'kurang',
  'belum', 'sudah', 'mendesak', 'prioritas', 'subcont', 'aktivitas', 'siapa', 'input',
  'edit', 'diedit', 'hari', 'ini', 'kemarin', 'minggu', 'bulan', 'tanggal', 'tahun',
  'berapa', 'apa', 'yang', 'untuk', 'dari', 'pada', 'total', 'semua', 'data', 'customer',
  'nama', 'saya', 'kamu', 'tolong', 'coba', 'dong', 'dan', 'atau', 'ke', 'di', 'ada',
  'the', 'os',
];
function aiTokenize(text) {
  return text.toLowerCase().split(/[^a-z0-9]+/i).filter(Boolean);
}
function aiFindCustomer(qLower) {
  const qTokens = aiTokenize(qLower).filter((w) => AI_STOPWORDS.indexOf(w) === -1 && (w.length >= 3 || /^\d+$/.test(w)));
  if (qTokens.length === 0) return null;
  let best = null;
  let bestScore = 0;
  CUSTOMER_LIST.forEach((c) => {
    const nameTokens = aiTokenize(c.n).filter((w) => AI_STOPWORDS.indexOf(w) === -1);
    let score = 0;
    qTokens.forEach((qt) => {
      if (nameTokens.indexOf(qt) !== -1) score += qt.length >= 4 ? 2 : 1;
    });
    if (score > 0 && (score > bestScore || (score === bestScore && best && c.n.length < best.length))) {
      bestScore = score;
      best = c.n;
    }
  });
  return best;
}

const BULAN_ALIASES = {
  januari: 0, jan: 0, februari: 1, feb: 1, maret: 2, mar: 2, april: 3, apr: 3,
  mei: 4, juni: 5, jun: 5, juli: 6, jul: 6, agustus: 7, agu: 7, ags: 7,
  september: 8, sep: 8, sept: 8, oktober: 9, okt: 9, november: 10, nov: 10, desember: 11, des: 11,
};

// Figures out which date/date-range the question refers to. Checks for an
// EXPLICIT date first ("tanggal 10 agustus", "10 agustus 2026") before
// falling back to relative phrases ("hari ini" / default, "kemarin",
// "minggu ini", "bulan ini"). Returns { from, to, label }.
function aiFindRange(qLower) {
  const today = todayISO();

  const explicit = qLower.match(/\b(\d{1,2})\s+(januari|jan|februari|feb|maret|mar|april|apr|mei|juni|jun|juli|jul|agustus|agu|ags|september|sept?|oktober|okt|november|nov|desember|des)\b(?:\s+(\d{4}))?/);
  if (explicit) {
    const day = Number(explicit[1]);
    const month = BULAN_ALIASES[explicit[2]];
    const year = explicit[3] ? Number(explicit[3]) : new Date().getFullYear();
    const iso = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    return { from: iso, to: iso, label: 'tanggal ' + fmtDate(iso) };
  }
  if (qLower.indexOf('kemarin') !== -1) {
    const d = new Date(); d.setDate(d.getDate() - 1);
    const iso = d.toISOString().slice(0, 10);
    return { from: iso, to: iso, label: 'kemarin (' + fmtDate(iso) + ')' };
  }
  if (qLower.indexOf('minggu ini') !== -1) {
    const d = new Date();
    const dow = d.getDay();
    const diffToMonday = dow === 0 ? 6 : dow - 1;
    const monday = new Date(d); monday.setDate(d.getDate() - diffToMonday);
    return { from: monday.toISOString().slice(0, 10), to: today, label: 'minggu ini' };
  }
  if (qLower.indexOf('bulan ini') !== -1) {
    return { from: firstDayOfMonthISO(), to: today, label: 'bulan ini (' + periodLabel(firstDayOfMonthISO(), today) + ')' };
  }
  return { from: today, to: today, label: 'hari ini (' + fmtDate(today) + ')' };
}

// The core intent-matching engine. Returns a plain-text answer string.
// NOTE: order matters -- OS/kekurangan/kelebihan detection runs BEFORE the
// generic "hasil produksi" check, since a question like "kelebihan produksi"
// contains the word "produksi" too and would otherwise be swallowed by the
// more general production-total branch.
function aiAnswer(question) {
  const qLower = question.toLowerCase();
  const customer = aiFindCustomer(qLower);
  const range = aiFindRange(qLower);

  // Greeting / small talk
  if (/^(halo|hai|hi|hey|pagi|siang|sore|malam)\b/.test(qLower.trim())) {
    return greetingLabel() + '! Ada yang bisa saya bantu cek? Coba tanya soal produksi, stok, PO, atau OS hari ini.';
  }
  if (/terima\s*kasih|makasih|thanks/.test(qLower)) {
    return 'Sama-sama! Ada lagi yang mau dicek?';
  }

  // Subcont
  if (qLower.indexOf('subcont') !== -1) {
    const filtered = state.produksi.filter((r) => r.sumber === 'subcont' && r.tanggal >= range.from && r.tanggal <= range.to && (!customer || normKey(r.nama) === normKey(customer)));
    const total = filtered.reduce((s, r) => s + (Number(r.qty) || 0), 0);
    if (filtered.length === 0) return 'Tidak ada pallet subcont ' + range.label + (customer ? ' untuk ' + customer : '') + '.';
    const bySupplier = {};
    filtered.forEach((r) => { const k = r.subcontNama || '(tanpa nama)'; bySupplier[k] = (bySupplier[k] || 0) + (Number(r.qty) || 0); });
    const supplierLines = Object.keys(bySupplier).map((k) => '- ' + k + ': ' + fmtNum(bySupplier[k]) + ' pcs').join('\n');
    return 'Pallet subcont ' + range.label + (customer ? ' untuk ' + customer : '') + ': ' + fmtNum(total) + ' pcs.\n\n' + supplierLines;
  }

  // OS / kekurangan / kelebihan produksi (checked before the generic
  // "hasil produksi" branch -- see note above)
  if (/\bos\b|kekurangan|kelebihan|belum\s*produksi|mendesak|prioritas|lebih\s*produksi/.test(qLower)) {
    const agg = computeAggregates();
    const wantLebih = /kelebihan|lebih\s*produksi/.test(qLower);
    if (customer) {
      const row = agg.find((r) => normKey(r.nama) === normKey(customer));
      if (!row || (wantLebih ? row.os >= 0 : row.os <= 0)) {
        return customer + (wantLebih ? ' tidak ada kelebihan produksi saat ini.' : ' sudah tidak ada kekurangan produksi (lunas atau lebih).');
      }
      const tgl = nearestTglKirim(row.nama);
      if (wantLebih) return 'Produksi ' + customer + ' lebih ' + fmtNum(Math.abs(row.os)) + ' pcs dari PO.';
      return 'OS ' + customer + ': kurang ' + fmtNum(row.os) + ' pcs.' + (tgl ? ' Target kirim: ' + fmtDate(tgl) + ' (' + daysUntilLabel(tgl, todayISO()) + ').' : '');
    }
    if (wantLebih) {
      const lebih = agg.filter((r) => r.os < 0).sort((a, b) => a.os - b.os);
      if (lebih.length === 0) return 'Tidak ada customer dengan produksi lebih (surplus) saat ini.';
      const lines = lebih.slice(0, 8).map((r) => '- ' + r.nama + ': lebih ' + fmtNum(Math.abs(r.os)) + ' pcs').join('\n');
      return 'Ada ' + lebih.length + ' customer dengan produksi lebih dari PO:\n\n' + lines;
    }
    const kurang = agg.filter((r) => r.os > 0);
    if (kurang.length === 0) return 'Semua customer sudah lunas produksinya, tidak ada kekurangan saat ini.';
    const withJadwal = kurang.map((r) => Object.assign({}, r, { _tgl: nearestTglKirim(r.nama) }))
      .sort((a, b) => {
        if (a._tgl && b._tgl) return a._tgl < b._tgl ? -1 : a._tgl > b._tgl ? 1 : b.os - a.os;
        if (a._tgl && !b._tgl) return -1;
        if (!a._tgl && b._tgl) return 1;
        return b.os - a.os;
      }).slice(0, 5);
    const totalOs = kurang.reduce((s, r) => s + r.os, 0);
    const lines = withJadwal.map((r) => '- ' + r.nama + ': kurang ' + fmtNum(r.os) + ' pcs' + (r._tgl ? ' (' + daysUntilLabel(r._tgl, todayISO()) + ')' : '')).join('\n');
    return 'Ada ' + kurang.length + ' customer kekurangan produksi, total ' + fmtNum(totalOs) + ' pcs. Paling mendesak:\n\n' + lines;
  }

  // Hasil produksi (sendiri, excludes subcont)
  if (/produksi|diproduksi/.test(qLower) && !/po\s*masuk/.test(qLower)) {
    const filtered = state.produksi.filter((r) => r.sumber !== 'subcont' && r.tanggal >= range.from && r.tanggal <= range.to && (!customer || normKey(r.nama) === normKey(customer)));
    const total = filtered.reduce((s, r) => s + (Number(r.qty) || 0), 0);
    if (filtered.length === 0) return 'Belum ada hasil produksi ' + range.label + (customer ? ' untuk ' + customer : '') + '.';
    if (customer) return 'Hasil produksi ' + customer + ' ' + range.label + ': ' + fmtNum(total) + ' pcs (' + filtered.length + ' entri).';
    const byCust = {};
    filtered.forEach((r) => { byCust[r.nama] = (byCust[r.nama] || 0) + (Number(r.qty) || 0); });
    const top = Object.keys(byCust).sort((a, b) => byCust[b] - byCust[a]).slice(0, 5)
      .map((n) => '- ' + n + ': ' + fmtNum(byCust[n]) + ' pcs').join('\n');
    return 'Hasil produksi ' + range.label + ': ' + fmtNum(total) + ' pcs dari ' + Object.keys(byCust).length + ' customer.\n\n' + top;
  }

  // PO Masuk
  if (/po\s*masuk|order\s*masuk/.test(qLower)) {
    const filtered = state.poIn.filter((r) => r.tanggal >= range.from && r.tanggal <= range.to && (!customer || normKey(r.nama) === normKey(customer)));
    const total = filtered.reduce((s, r) => s + (Number(r.qty) || 0), 0);
    if (filtered.length === 0) return 'Tidak ada PO masuk ' + range.label + (customer ? ' untuk ' + customer : '') + '.';
    return 'PO masuk ' + range.label + (customer ? ' untuk ' + customer : '') + ': ' + fmtNum(total) + ' pcs (' + filtered.length + ' PO).';
  }

  // Pallet keluar / kirim
  if (/pallet\s*keluar|palet\s*keluar|dikirim|kirim\s*wh|keluar\s*wh/.test(qLower) || /keluar/.test(qLower)) {
    const filtered = state.keluar.filter((r) => r.tanggal >= range.from && r.tanggal <= range.to && (!customer || normKey(r.nama) === normKey(customer)));
    const total = filtered.reduce((s, r) => s + (Number(r.qty) || 0), 0);
    if (filtered.length === 0) return 'Tidak ada pallet keluar ' + range.label + (customer ? ' untuk ' + customer : '') + '.';
    return 'Pallet keluar ' + range.label + (customer ? ' untuk ' + customer : '') + ': ' + fmtNum(total) + ' pcs (' + filtered.length + ' pengiriman).';
  }

  // Stok palet
  if (/stok|stock/.test(qLower)) {
    const agg = computeAggregates();
    if (customer) {
      const row = agg.find((r) => normKey(r.nama) === normKey(customer));
      if (!row) return 'Belum ada data stok untuk ' + customer + '.';
      return 'Stok palet ' + customer + ': ' + fmtNum(row.stok) + ' pcs (siap kirim WH: ' + fmtNum(row.siapWH) + ', belum siap: ' + fmtNum(row.belumWH) + ').';
    }
    const withStok = agg.filter((r) => r.stok > 0);
    const totalStok = withStok.reduce((s, r) => s + r.stok, 0);
    const totalBelumWH = withStok.reduce((s, r) => s + r.belumWH, 0);
    const habis = agg.filter((r) => r.stok <= 0 && (r.produksi > 0 || r.keluar > 0 || r.stokAwal !== 0)).length;
    return 'Total stok palet: ' + fmtNum(totalStok) + ' pcs dari ' + withStok.length + ' customer (' + fmtNum(totalBelumWH) + ' pcs belum siap kirim WH). ' + habis + ' customer stoknya habis.';
  }

  // Aktivitas terakhir / siapa input
  if (/aktivitas|siapa\s*(yang\s*)?input|siapa\s*(yang\s*)?edit/.test(qLower)) {
    const feed = buildActivityFeed().slice(0, 5);
    if (feed.length === 0) return 'Belum ada aktivitas tercatat.';
    const lines = feed.map((r) => '- ' + r._label + ' ' + r.nama + ' (' + fmtNum(r.qty) + ' pcs) oleh ' + (r.updated_by || r.created_by || '?') + ', ' + (r.loggedAt ? fmtDateTime(r.loggedAt) : fmtDate(r.tanggal))).join('\n');
    return 'Aktivitas terbaru:\n\n' + lines;
  }

  // Fallback
  return (
    'Maaf, saya belum paham pertanyaan itu. Saya bisa bantu jawab seputar data aplikasi ini, contohnya:\n\n' +
    AI_SUGGESTIONS.slice(0, 4).map((s) => '- ' + s).join('\n')
  );
}

function openAi() {
  state.aiOpen = true;
  if (state.aiMessages.length === 0) {
    state.aiMessages.push({ role: 'ai', text: greetingLabel() + '! Saya bisa bantu cek data aplikasi ini secara langsung. Coba tanya salah satu di bawah, atau ketik pertanyaan sendiri.' });
  }
  render();
  const scroll = document.getElementById('ai-chat-scroll');
  if (scroll) scroll.scrollTop = scroll.scrollHeight;
}
function closeAi() { state.aiOpen = false; render(); }

function aiSend(text) {
  const q = (text || '').trim();
  if (!q) return;
  state.aiMessages.push({ role: 'user', text: q });
  state.aiMessages.push({ role: 'ai', text: aiAnswer(q) });
  render();
  const input = document.getElementById('ai-input');
  if (input) input.value = '';
  const scroll = document.getElementById('ai-chat-scroll');
  if (scroll) scroll.scrollTop = scroll.scrollHeight;
}

async function loadTeamMembers() {
  const container = document.getElementById('team-members-list');
  if (!container) return;
  try {
    const { data, error } = await sb.rpc('list_team_members');
    if (error) throw error;
    const members = data || [];
    if (members.length === 0) {
      container.innerHTML = '<div class="empty-state" style="padding:16px;">Belum ada anggota terdaftar.</div>';
      return;
    }
    container.innerHTML = '<div class="record-list">' + members.map((m) => (
      '<div class="record-row">' +
        '<div class="record-main">' +
          '<div class="record-name">' + esc(m.nama) + (state.account && m.nama === state.account.nama ? ' <span class="me-tag">Kamu</span>' : '') + '</div>' +
          '<div class="record-meta">' + esc(m.bagian) + '</div>' +
        '</div>' +
      '</div>'
    )).join('') + '</div>';
  } catch (e) {
    container.innerHTML = '<div class="empty-state" style="padding:16px;">Gagal memuat daftar anggota.</div>';
  }
}

function bindSettingsEvents() {
  const closeBtn = document.getElementById('settings-close');
  if (closeBtn) closeBtn.addEventListener('click', closeSettings);

  document.querySelectorAll('[data-settings-section]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.settingsSection = btn.getAttribute('data-settings-section');
      render();
    });
  });
  const backBtn = document.getElementById('settings-back');
  if (backBtn) backBtn.addEventListener('click', () => { state.settingsSection = null; render(); });

  const aiToggle = document.getElementById('ai-enabled-toggle');
  if (aiToggle) {
    aiToggle.addEventListener('click', () => {
      state.aiEnabled = !state.aiEnabled;
      if (!state.aiEnabled) state.aiOpen = false;
      try { localStorage.setItem('mdpalletindo_ai_enabled', state.aiEnabled ? '1' : '0'); } catch (e) { /* ignore */ }
      render();
    });
  }

  loadTeamMembers();
  bindBaselineForm();
  bindTruckList();

  const logoutBtn = document.getElementById('settings-logout');
  if (logoutBtn) logoutBtn.addEventListener('click', () => { closeSettings(); doLogout(); });

  const profileSave = document.getElementById('profile-save');
  if (profileSave) {
    profileSave.addEventListener('click', async () => {
      const nama = document.getElementById('settings-nama').value || '';
      const bagian = document.getElementById('settings-bagian').value || '';
      if (!nama.trim() || !bagian.trim()) {
        showSettingsMsg('profile-msg', 'Nama dan Bagian wajib diisi.', true);
        return;
      }
      profileSave.textContent = 'Menyimpan...';
      const result = await saveProfile(nama, bagian);
      if (!result.ok) {
        showSettingsMsg('profile-msg', result.error, true);
        return;
      }
      showSettingsMsg('profile-msg', 'Profil berhasil disimpan.', false);
    });
  }

  const passwordSave = document.getElementById('password-save');
  if (passwordSave) {
    passwordSave.addEventListener('click', async () => {
      const oldPw = document.getElementById('settings-pw-old').value || '';
      const newPw = document.getElementById('settings-pw-new').value || '';
      const confirmPw = document.getElementById('settings-pw-confirm').value || '';
      passwordSave.textContent = 'Menyimpan...';
      const result = await changePassword(oldPw, newPw, confirmPw);
      if (!result.ok) {
        showSettingsMsg('password-msg', result.error, true);
        passwordSave.innerHTML = '&#10003; Simpan Password Baru';
        return;
      }
      document.getElementById('settings-pw-old').value = '';
      document.getElementById('settings-pw-new').value = '';
      document.getElementById('settings-pw-confirm').value = '';
      passwordSave.innerHTML = '&#10003; Simpan Password Baru';
      showSettingsMsg('password-msg', 'Password berhasil diganti.', false);
    });
  }

  const pinSave = document.getElementById('pin-save');
  if (pinSave) {
    pinSave.addEventListener('click', async () => {
      const oldPin = document.getElementById('settings-pin-old').value || '';
      const newPin = document.getElementById('settings-pin-new').value || '';
      const confirmPin = document.getElementById('settings-pin-confirm').value || '';
      pinSave.textContent = 'Menyimpan...';
      const result = await changePin(oldPin, newPin, confirmPin);
      pinSave.innerHTML = '&#10003; Simpan PIN Baru';
      if (!result.ok) {
        showSettingsMsg('pin-change-msg', result.error, true);
        return;
      }
      document.getElementById('settings-pin-old').value = '';
      document.getElementById('settings-pin-new').value = '';
      document.getElementById('settings-pin-confirm').value = '';
      showSettingsMsg('pin-change-msg', 'PIN berhasil diganti.', false);
    });
  }
}

function renderTruckChips() {
  if (state.trucks.length === 0) return '<div class="empty-state" style="padding:12px;">Belum ada nopol tersimpan.</div>';
  return '<div class="truck-chips">' + state.trucks.map((n) => (
    '<span class="truck-chip">' + esc(n) + '</span>'
  )).join('') + '</div>';
}

function bindTruckList() {
  const addBtn = document.getElementById('truck-add');
  const input = document.getElementById('truck-new-input');
  if (!addBtn) return;
  addBtn.addEventListener('click', async () => {
    const val = input.value || '';
    addBtn.textContent = 'Menyimpan...';
    const result = await addTruck(val);
    addBtn.innerHTML = '+ Tambah ke Daftar';
    if (!result.ok) {
      showSettingsMsg('truck-msg', result.error, true);
      return;
    }
    input.value = '';
    document.getElementById('truck-list').innerHTML = renderTruckChips();
    showSettingsMsg('truck-msg', 'Nopol berhasil ditambahkan ke daftar.', false);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); }
  });
}

function bindBaselineForm() {
  const namaInputCheck = document.getElementById('baseline-nama-input');
  if (!namaInputCheck) return; // baseline section isn't the one currently shown

  bindCombobox('baseline-nama');

  const namaInput = document.getElementById('baseline-nama-input');
  const osInput = document.getElementById('baseline-os');
  const stokInput = document.getElementById('baseline-stok');
  const saveBtn = document.getElementById('baseline-save');

  const prefill = () => {
    const nama = (namaInput.value || '').trim();
    if (!nama) return;
    const key = Object.keys(OS_AWAL).concat(Object.keys(STOK_AWAL)).find((k) => k.toLowerCase() === nama.toLowerCase());
    osInput.value = key && OS_AWAL[key] != null ? OS_AWAL[key] : (OS_AWAL[nama] || 0);
    stokInput.value = key && STOK_AWAL[key] != null ? STOK_AWAL[key] : (STOK_AWAL[nama] || 0);
  };

  namaInput.addEventListener('change', prefill);
  document.getElementById('baseline-nama-panel').addEventListener('click', () => setTimeout(prefill, 0));

  saveBtn.addEventListener('click', async () => {
    const nama = namaInput.value || '';
    if (!nama.trim()) {
      showSettingsMsg('baseline-msg', 'Pilih atau ketik nama customer dulu.', true);
      return;
    }
    saveBtn.textContent = 'Menyimpan...';
    const result = await saveBaseline(nama, osInput.value, stokInput.value);
    saveBtn.innerHTML = '&#10003; Simpan Saldo Awal';
    if (!result.ok) {
      showSettingsMsg('baseline-msg', result.error, true);
      return;
    }
    showSettingsMsg('baseline-msg', 'Saldo awal untuk ' + nama.trim() + ' berhasil disimpan.', false);
  });
}

function renderPinModal() {
  const pm = state.pinModal;
  if (!pm) return '';
  return (
    '<div class="pin-modal-backdrop">' +
      '<div class="pin-modal-card">' +
        '<div class="pin-modal-icon">&#128274;</div>' +
        '<div class="pin-modal-title">Konfirmasi Hapus</div>' +
        '<div class="pin-modal-sub">Masukkan PIN untuk menghapus<br><strong>' + esc(pm.label || 'data ini') + '</strong></div>' +
        '<input id="pin-input" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="&bull;&bull;&bull;&bull;" autocomplete="off">' +
        (pm.error ? '<div class="pin-error">' + esc(pm.error) + '</div>' : '') +
        '<div class="pin-modal-actions">' +
          '<button type="button" id="pin-cancel" class="pin-btn cancel">Batal</button>' +
          '<button type="button" id="pin-confirm" class="pin-btn confirm">Hapus</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function bindPinModalEvents() {
  const backdrop = document.querySelector('.pin-modal-backdrop');
  if (!backdrop) return;
  const input = document.getElementById('pin-input');
  const cancelBtn = document.getElementById('pin-cancel');
  const confirmBtn = document.getElementById('pin-confirm');

  input.focus();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); submitPin(input.value); }
  });
  cancelBtn.addEventListener('click', closePinModal);
  confirmBtn.addEventListener('click', () => submitPin(input.value));
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) closePinModal();
  });
}

function bindTabContentEvents() {
  if (state.storeStatus !== 'ready') return;

  switch (state.tab) {
    case 'poin': bindPoInEvents(); break;
    case 'produksi': bindProduksiEvents(); break;
    case 'keluar': bindKeluarEvents(); break;
    case 'os': bindOsEvents(); break;
    case 'stok': bindStokEvents(); break;
    case 'dashboard': bindDashboardEvents(); break;
  }
}

function bindPoInEvents() {
  bindCombobox('poin-nama');

  document.getElementById('poin-submit').addEventListener('click', () => {
    const nama = comboNama('poin-nama');
    const qty = document.getElementById('poin-qty').value;
    if (!nama || !qty) return;
    const record = {
      tanggal: document.getElementById('poin-tanggal').value || todayISO(),
      nama: nama,
      ukuran: comboUkuran('poin-nama'),
      qty: Number(qty),
      noPo: document.getElementById('poin-nopo').value,
      tglKirim: document.getElementById('poin-tglkirim').value,
      catatan: document.getElementById('poin-catatan').value,
    };
    if (state.editing.poin) updatePoIn(state.editing.poin, record);
    else addPoIn(record);
  });

  const cancelBanner = document.getElementById('poin-cancel-edit');
  const cancelForm = document.getElementById('poin-cancel-edit-2');
  if (cancelBanner) cancelBanner.addEventListener('click', () => cancelEdit('poin'));
  if (cancelForm) cancelForm.addEventListener('click', () => cancelEdit('poin'));

  document.querySelectorAll('[data-edit-poin]').forEach((btn) => {
    btn.addEventListener('click', () => startEdit('poin', btn.getAttribute('data-edit-poin')));
  });
  document.querySelectorAll('[data-remove-poin]').forEach((btn) => {
    btn.addEventListener('click', () => requestDelete('poin', btn.getAttribute('data-remove-poin'), btn.getAttribute('data-label')));
  });

  const dateFilter = document.getElementById('poin-datefilter');
  if (dateFilter) dateFilter.addEventListener('change', () => { state.dateFilter.poin = dateFilter.value; render(); });
  const dateFilterClear = document.getElementById('poin-datefilter-clear');
  if (dateFilterClear) dateFilterClear.addEventListener('click', () => { state.dateFilter.poin = ''; render(); });

  const openReportBtn = document.getElementById('open-report-poin');
  if (openReportBtn) openReportBtn.addEventListener('click', () => openReport('poin'));
}

function bindProduksiEvents() {
  bindCombobox('prod-nama');

  const sumberSelect = document.getElementById('prod-sumber');
  const subcontWrap = document.getElementById('prod-subcont-wrap');
  if (sumberSelect && subcontWrap) {
    sumberSelect.addEventListener('change', () => {
      subcontWrap.style.display = sumberSelect.value === 'subcont' ? '' : 'none';
    });
  }

  document.getElementById('prod-submit').addEventListener('click', () => {
    const nama = comboNama('prod-nama');
    const qty = document.getElementById('prod-qty').value;
    if (!nama || !qty) return;
    const sumber = (document.getElementById('prod-sumber') || {}).value || 'sendiri';
    const record = {
      tanggal: document.getElementById('prod-tanggal').value || todayISO(),
      nama: nama,
      ukuran: comboUkuran('prod-nama'),
      qty: Number(qty),
      sumber: sumber,
      subcontNama: sumber === 'subcont' ? (document.getElementById('prod-subcont-nama') || {}).value || '' : '',
      catatan: document.getElementById('prod-catatan').value,
    };
    if (state.editing.produksi) updateProduksi(state.editing.produksi, record);
    else addProduksi(record);
  });

  const cancelBanner = document.getElementById('prod-cancel-edit');
  const cancelForm = document.getElementById('prod-cancel-edit-2');
  if (cancelBanner) cancelBanner.addEventListener('click', () => cancelEdit('produksi'));
  if (cancelForm) cancelForm.addEventListener('click', () => cancelEdit('produksi'));

  document.querySelectorAll('[data-edit-prod]').forEach((btn) => {
    btn.addEventListener('click', () => startEdit('produksi', btn.getAttribute('data-edit-prod')));
  });
  document.querySelectorAll('[data-remove-prod]').forEach((btn) => {
    btn.addEventListener('click', () => requestDelete('produksi', btn.getAttribute('data-remove-prod'), btn.getAttribute('data-label')));
  });

  const dateFilter = document.getElementById('produksi-datefilter');
  if (dateFilter) dateFilter.addEventListener('change', () => { state.dateFilter.produksi = dateFilter.value; render(); });
  const dateFilterClear = document.getElementById('produksi-datefilter-clear');
  if (dateFilterClear) dateFilterClear.addEventListener('click', () => { state.dateFilter.produksi = ''; render(); });

  document.querySelectorAll('[data-sumber-filter]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.produksiSumberFilter = btn.getAttribute('data-sumber-filter');
      render();
    });
  });

  const openReportBtn = document.getElementById('open-report-produksi');
  if (openReportBtn) openReportBtn.addEventListener('click', () => openReport('produksi'));
  const openSubcontBtn = document.getElementById('open-report-subcont');
  if (openSubcontBtn) openSubcontBtn.addEventListener('click', () => openReport('subcont'));
}

function bindKeluarEvents() {
  bindCombobox('keluar-nama');
  bindTruckCombobox('keluar-nopol');

  document.getElementById('keluar-submit').addEventListener('click', () => {
    const nama = comboNama('keluar-nama');
    const qty = document.getElementById('keluar-qty').value;
    if (!nama || !qty) return;
    const record = {
      tanggal: document.getElementById('keluar-tanggal').value || todayISO(),
      nama: nama,
      ukuran: comboUkuran('keluar-nama'),
      qty: Number(qty),
      nopol: (truckComboValue('keluar-nopol') || '').toUpperCase(),
      catatan: document.getElementById('keluar-catatan').value,
    };
    if (state.editing.keluar) updateKeluar(state.editing.keluar, record);
    else addKeluar(record);
  });

  const cancelBanner = document.getElementById('keluar-cancel-edit');
  const cancelForm = document.getElementById('keluar-cancel-edit-2');
  if (cancelBanner) cancelBanner.addEventListener('click', () => cancelEdit('keluar'));
  if (cancelForm) cancelForm.addEventListener('click', () => cancelEdit('keluar'));

  document.querySelectorAll('[data-edit-keluar]').forEach((btn) => {
    btn.addEventListener('click', () => startEdit('keluar', btn.getAttribute('data-edit-keluar')));
  });
  document.querySelectorAll('[data-remove-keluar]').forEach((btn) => {
    btn.addEventListener('click', () => requestDelete('keluar', btn.getAttribute('data-remove-keluar'), btn.getAttribute('data-label')));
  });

  const dateFilter = document.getElementById('keluar-datefilter');
  if (dateFilter) dateFilter.addEventListener('change', () => { state.dateFilter.keluar = dateFilter.value; render(); });
  const dateFilterClear = document.getElementById('keluar-datefilter-clear');
  if (dateFilterClear) dateFilterClear.addEventListener('click', () => { state.dateFilter.keluar = ''; render(); });

  const openReportBtn = document.getElementById('open-report-keluar');
  if (openReportBtn) openReportBtn.addEventListener('click', () => openReport('keluar'));
  const openMutasiBtn = document.getElementById('open-mutasi-live');
  if (openMutasiBtn) openMutasiBtn.addEventListener('click', () => { state.mutasiOpen = true; render(); });
}

function bindOsEvents() {
  const agg = computeAggregates();
  const rows = agg.filter((r) => r.os !== 0).sort((a, b) => b.os - a.os);
  const shown = state.osFilter === 'kurang' ? rows.filter((r) => r.os > 0)
    : state.osFilter === 'lebih' ? rows.filter((r) => r.os < 0)
    : rows;
  const search = document.getElementById('os-search');
  search.addEventListener('input', () => {
    document.getElementById('os-list').innerHTML = renderOsList(shown, search.value);
  });
  document.querySelectorAll('[data-os-filter]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-os-filter');
      state.osFilter = state.osFilter === key ? 'semua' : key;
      render();
    });
  });
  const openReportBtn = document.getElementById('open-report-os');
  if (openReportBtn) openReportBtn.addEventListener('click', () => openReport('os'));
}

function bindStokEvents() {
  const agg = computeAggregates();
  const rows = agg.filter((r) => r.produksi > 0 || r.keluar > 0 || r.stokAwal !== 0).sort((a, b) => a.stok - b.stok);
  const withStok = rows.filter((r) => r.stok > 0);
  const habisRows = rows.filter((r) => r.stok <= 0);

  const search = document.getElementById('stok-search');
  search.addEventListener('input', () => {
    document.getElementById('stok-list').innerHTML = renderStokList(withStok, search.value);
    const habisList = document.getElementById('stok-habis-list');
    if (habisList) habisList.innerHTML = renderStokList(habisRows, search.value);
    bindWhInputs();
  });

  const habisToggle = document.getElementById('stok-habis-toggle');
  if (habisToggle) {
    habisToggle.addEventListener('click', () => {
      state.stokHabisOpen = !state.stokHabisOpen;
      render();
    });
  }

  const openReview = document.getElementById('open-review');
  if (openReview) {
    openReview.addEventListener('click', () => {
      state.reviewOpen = true;
      render();
    });
  }
  bindWhInputs();
}

function bindWhInputs() {
  document.querySelectorAll('.wh-input').forEach((input) => {
    input.addEventListener('change', () => {
      setReadyWH(input.getAttribute('data-wh-nama'), input.value);
    });
  });
}

function bindDashboardEvents() {
  const gotoOs = document.getElementById('goto-os');
  if (gotoOs) gotoOs.addEventListener('click', () => { state.tab = 'os'; render(); });
  const openActivityLog = document.getElementById('open-activity-log');
  if (openActivityLog) openActivityLog.addEventListener('click', () => { state.activityLogOpen = true; render(); });
}

// ---------------- Boot ----------------
initAccounts();

// Keeps the dashboard's "Selamat Pagi/Siang/Sore/Malam" greeting and today's
// date genuinely real-time -- re-renders the dashboard once a minute (only
// when it's actually the visible tab) purely so the greeting/date can update
// even if nothing else changes, e.g. the app stays open across a time-of-day
// boundary or past midnight.
setInterval(() => {
  if (state.tab === 'dashboard' && !state.settingsOpen && !state.reviewOpen && !state.mutasiOpen && !state.activityLogOpen && !state.poBelumOpen) {
    render();
  }
}, 60000);
</script>
